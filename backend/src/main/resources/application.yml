spring:
  application:
    name: smart-home-platform
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Cache dla profili zuzycia z InfluxDB (rate limit free plan!)
  # Caffeine daje TTL - po 5 min cache expiruje, wiec dla testu RUNNING
  # zawsze uzyskujemy swieze dane, a dla COMPLETED cache eliminuje 99% zapytań.
  cache:
    type: caffeine
    cache-names: hourlyEnergy
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    pl.smarthome.platform: DEBUG
    org.eclipse.paho: WARN
    com.influxdb: WARN

# Konfiguracja platformy
platform:
  executor:
    # 12 watkow rownolegle - symulacje sa I/O bound (MQTT + InfluxDB),
    # wiec zwiekszenie puli daje realny 4x speedup wzgl. pool-size 3.
    pool-size: 12
  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id-prefix: smart-home-backend
    qos: 1
  influx:
    url: ${INFLUX_URL}
    org: ${INFLUX_ORG}
    bucket: ${INFLUX_BUCKET}
    token: ${INFLUX_TOKEN}
