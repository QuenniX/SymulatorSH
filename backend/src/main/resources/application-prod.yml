
spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    # Wylaczamy walidacje sum kontrolnych bo git core.autocrlf zamienia CRLF/LF miedzy
    # Windows (lokalne dev) i Linux (EC2), co zmienia bajty plikow migracji i checksum.
    # Nowe migracje sa aplikowane normalnie - tylko sprawdzenie ze stare pliki maja
    # identyczna zawartosc z tym co bylo aplikowane w bazie jest pominiete.
    validate-on-migrate: false

platform:
  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://mosquitto:1883}
  influx:
    url: ${INFLUX_URL}
    org: ${INFLUX_ORG}
    bucket: ${INFLUX_BUCKET}
    token: ${INFLUX_TOKEN}
